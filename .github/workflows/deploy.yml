name: Deploy aion-lumen (static)

# Static-site deploy: push to main -> rsync the repo to the VPS that Caddy serves
# from /srv/aion-lumen. aion-lumen is NOT a running app, so there is deliberately
# no build / migrate / service restart / health check / rollback (unlike frag-shifu).

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual trigger for the first run / emergencies

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync static site to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent (dedicated deploy key)
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: ssh-keyscan -H 185.143.100.222 >> ~/.ssh/known_hosts

      - name: Build referenced public files
        run: python3 scripts/build-public.py

      - name: Deploy reviewed public files
        run: |
          # No source directories or internal notes are copied wholesale.
          # Retirement of old server files uses the separately reviewed list.
          rsync -avz site-dist/ aionlumen@185.143.100.222:/srv/aion-lumen/
