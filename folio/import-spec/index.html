      .spec-wrap {

      }
      .spec-body p {
        color: var(--ink-soft);
        line-height: 1.68;
        margin: 0.7em 0;
      }
      .spec-body a {
        color: var(--ink);
        border-bottom: 1px solid var(--rule);
      }
      .spec-body strong {
        color: var(--ink);
        font-weight: 600;
      }
      .spec-body em {
        color: var(--ink);
      }
      .spec-body code {
        font-family: var(--f-mono);
        font-size: 0.94em;
        background: var(--bg-warm);
        border: 1px solid var(--rule-soft);
        border-radius: 4px;
        padding: 0.08em 0.35em;
        color: var(--ink);
      }
      .spec-body pre {
        overflow: auto;
        background: var(--bg-warm);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 14px 16px;
        margin: 1em 0;
      }
      .spec-body pre code {
        background: transparent;
        border: 0;
        padding: 0;
        display: block;
        line-height: 1.5;
      }
      .spec-body ul,
      .spec-body ol {
        margin: 0.7em 0 0.9em 1.35em;
        color: var(--ink-soft);
        line-height: 1.66;
      }
      .spec-body blockquote {
        margin: 1em 0;
        padding: 0.3em 0 0.3em 1em;
        border-left: 2px solid var(--accent);
        color: var(--ink);
      }
      .spec-body hr {
        border: 0;
        border-top: 1px solid var(--rule-soft);
        margin: 1.2em 0;
      }
      .spec-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 1em 0;
        font-size: 0.95rem;
      }
      .spec-body th,
      .spec-body td {
        border: 1px solid var(--rule);
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }
      .spec-body th {
        color: var(--ink);
        background: var(--bg-warm);
        font-weight: 600;
      }
      .spec-loading {
        color: var(--ink-mute);
        font-family: var(--f-mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 12px;
      }
      .spec-error {
        color: #d9b0a8;
        border: 1px solid #6a3a30;
        background: color-mix(in srgb, #6a3a30 20%, transparent);
        border-radius: 4px;
        padding: 10px 12px;
      }
